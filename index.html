<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DCC Blood Donors</title>
<link rel="icon" type="image/png" href="img/logo.png">
<link rel="apple-touch-icon" href="img/logo.png">
<link rel="stylesheet" href="css/style.css">
<!-- Vercel Web Analytics -->
<script>
  window.va = function () {
    (window.vaq = window.vaq || []).push(arguments);
  };
</script>
<script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>
<body>

<div id="loader" class="loader">
  <svg class="loader-drop" viewBox="0 0 24 24" width="48" height="48" fill="currentColor">
    <path d="M12 2C12 2 5 11.5 5 16a7 7 0 0 0 14 0c0-4.5-7-14-7-14z"/>
  </svg>
  <p>Loading directory...</p>
</div>

<div id="app" class="app" hidden>

  <header class="header">
    <div class="header-top">
      <div class="header-title">
        <h1>
          <span class="title-primary">DCC CLUB CHOLAKKARATHAZHAM</span>
          <span class="subtitle">Blood Donors Directory 
            <!-- <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" class="subtitle-drop" aria-hidden="true"><path d="M12 21s-6-4.35-6-10A6 6 0 0 1 12 5a6 6 0 0 1 6 6c0 5.65-6 10-6 10z"/></svg> -->
          </span>
        </h1>
      </div>
    </div>

    <div class="search-row">
      <div class="search-bar">
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"/>
          <path d="M21 21l-4.35-4.35"/>
        </svg>
        <input id="searchInput" type="text" placeholder="Search by name or phone number..." autocomplete="off">
      </div>
      <button id="darkModeToggle" class="icon-btn" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg class="icon icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" hidden>
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </header>

  <nav class="filter-bar" id="filterBar" aria-label="Filter by blood group"></nav>

  <main class="member-list" id="memberList"></main>

  <p id="noResults" class="no-results" hidden>
    <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
    No members found
  </p>
</div>

<script src="js/app.js"></script>
</body>
</html>
